<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GA Sambosa</title>
  <link rel="stylesheet" href="./css/style.css">
  <script defer src="./js/data.js"></script>
  <script defer src="./js/app.js"></script>
</head>
<body>
  <div id="game">
    <div class="hud">
      <p><span id="score">0</span> / <span id="goal">0</span></p>
      <p>Best: <span id="best">0</span></p>
    </div>

    <img id="sambosa" class="idle" src="./images/sambosa.png" alt="sambosa">

    <div id="screen">
      <h2 id="title"></h2>
      <button id="play-btn">▶ Play</button>
    </div>
  </div>
</body>
</html>
